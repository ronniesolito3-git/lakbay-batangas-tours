<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Classroom HTML example for the Lakbay Batangas Tours website project.">
  <title>Lakbay Batangas Tours | HTML Day 3 Example</title>
</head>
<body>
  <!-- A header gives the site a clear identity and contains the navigation. -->

    <h1>Lakbay Batangas Tours</h1>

    <!-- Each href points to a matching, unique section ID below. -->
    <nav aria-label="Main navigation">
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#packages">Tour Packages</a></li>
        <li><a href="#why">Why Choose Us</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  
</body>
</html>
